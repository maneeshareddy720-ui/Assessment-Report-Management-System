{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}Form{% endblock %}</title>

  <!-- Bootstrap 5 style -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Prompt', sans-serif;
      background: #f8f9fa;
      margin: 0;
    }

    /* Navbar with gradient */
    .navbar-custom {
      background: linear-gradient(135deg, #003366, #0055cc); /* Professional blue gradient */
      padding: 0.6rem 1.2rem;
    }

    .navbar-brand img {
      height: 45px;
      width: auto;
      margin-right: 12px;
      background: #ffffff;     /* White background for logo */
      padding: 5px;
      border-radius: 6px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }

    .navbar-brand span {
      font-weight: 700;
      font-size: 1.25rem;
      letter-spacing: 0.5px;
      color: #fff;
    }

    footer {
      padding: 12px 20px;
      background: #f9f9f9;
      font-size: 0.9rem;
      text-align: center;
      color: #666;
      border-top: 1px solid #ddd;
      margin-top: 30px;
    }
  </style>
</head>
<body>

  <!-- Top Navbar (Logo + Company Name only) -->
  <nav class="navbar navbar-expand-lg navbar-dark navbar-custom shadow-sm">
    <div class="container-fluid">
      <a class="navbar-brand d-flex align-items-center" href="#">
        <img src="{% static 'images/bics_logo.png' %}" alt="BICS Global Logo">
        <span>BICS GLOBAL</span>
      </a>
    </div>
  </nav>

  <!-- Page Content -->
  <main class="container mt-4">
    {% block content %}{% endblock %}
  </main>

  <footer>
    © 2025, powered by <strong>Bics Global</strong>.
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
