{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}Dashboard{% endblock %}</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

  <style>
    body {
      font-family: 'Prompt', sans-serif;
      background: #f8f9fa;
      margin: 0;
    }

    /* Sidebar */
    .sidebar {
      position: fixed;
      top: 0; bottom: 0; left: 0;
      z-index: 100;
      width: 250px;
      background: #fff;
      border-right: 1px solid #e0e0e0;
      box-shadow: 2px 0 10px rgba(0,0,0,0.05);
      padding-top: 1rem;
      transition: all 0.3s ease;
      overflow-y: auto;
    }

    .sidebar .brand {
      text-align: center;
      padding: 1.5rem 0;
      border-bottom: 1px solid #eee;
    }
    .sidebar .brand img {
      max-height: 50px;
    }

    .sidebar .nav-link {
      display: flex;
      align-items: center;
      gap: 12px;
      color: #002855;
      font-weight: 500;
      padding: 12px 20px;
      border-radius: 10px;
      margin: 5px 12px;
      transition: all 0.2s;
    }
    .sidebar .nav-link i {
      font-size: 1.1rem;
    }
    .sidebar .nav-link:hover {
      background: #004080;
      color: #fff !important;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    .sidebar .nav-link.active {
      background: #0066cc;
      color: #fff !important;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.1);
    }

    .sidebar .collapse .nav-link {
      padding-left: 40px;
      font-size: 0.95rem;
      color: #004080;
      margin: 2px 12px;
    }
    .sidebar .collapse .nav-link:hover {
      background: #0059b3;
      color: #fff !important;
    }

    .content {
      margin-left: 250px;
      padding: 20px;
      transition: all 0.3s;
    }

    footer {
      margin-left: 250px;
      padding: 10px 20px;
      background: #f9f9f9;
      font-size: 0.9rem;
      text-align: center;
      color: #666;
      border-top: 1px solid #ddd;
      transition: all 0.3s;
    }

    /* Collapse arrow */
    .sidebar .nav-link .bi-chevron-down {
      margin-left: auto;
      transition: transform 0.3s ease;
    }
    .sidebar .collapse.show + .nav-link .bi-chevron-down {
      transform: rotate(180deg);
    }

    @media (max-width: 768px) {
      .sidebar { left: -250px; }
      .sidebar.active { left: 0; box-shadow: 2px 0 20px rgba(0,0,0,0.2); }
      .content, footer { margin-left: 0; }
    }
  </style>
</head>
<body>

<!-- Sidebar -->
<nav class="sidebar" id="sidebarMenu">
  <div class="brand">
    <img src="{% static 'images/bics_logo.png' %}" alt="BICS GLOBAL">
  </div>
  <div class="nav flex-column">
    <a class="nav-link {% if request.resolver_match.url_name == 'dashboard_home' %}active{% endif %}" 
       href="{% url 'dashboard_home' %}">
      <i class="bi bi-house-door"></i> Dashboard Home
    </a>

    <!-- Admins -->
    <a class="nav-link d-flex justify-content-between align-items-center" 
       data-bs-toggle="collapse" href="#adminsMenu" role="button" aria-expanded="false">
      <span><i class="bi bi-speedometer2"></i> Admins</span>
      <i class="bi bi-chevron-down"></i>
    </a>
    <div class="collapse ps-3" id="adminsMenu">
      <a class="nav-link" href="{% url 'super_admin' %}"><i class="bi bi-star"></i> Super Admin</a>
      <a class="nav-link" href="{% url 'admin_user' %}"><i class="bi bi-person-workspace"></i> Admin User</a>
    </div>

    <!-- Interns -->
    <a class="nav-link d-flex justify-content-between align-items-center" 
       data-bs-toggle="collapse" href="#internsMenu" role="button" aria-expanded="false">
      <span><i class="bi bi-people"></i> Interns</span>
      <i class="bi bi-chevron-down"></i>
    </a>
    <div class="collapse ps-3" id="internsMenu">
      <a class="nav-link" href="{% url 'admin_dashboard' %}"><i class="bi bi-speedometer"></i> Intern Dashboard</a>
      <a class="nav-link" href="{% url 'intern_reports' %}"><i class="bi bi-bar-chart-line"></i> Assessment
        s</a>
      <a class="nav-link" href="{% url 'dashboard' %}"><i class="bi bi-journal-text"></i> Reports Dashboard</a>
    </div>

    <hr>
    <a class="nav-link {% if request.resolver_match.url_name == 'profile' %}active{% endif %}" href="{% url 'profile' %}">
      <i class="bi bi-person-circle"></i> Profile
    </a>
    <a class="nav-link" href="{% url 'admin_logout' %}">
      <i class="bi bi-box-arrow-right"></i> Log Out
    </a>
  </div>
</nav>

<!-- Page Content -->
<main class="content">
  {% block content %}{% endblock %}
</main>

<footer>
  © 2025, powered by <strong>BICS Global</strong>.
</footer>

<!-- JS Libraries -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
